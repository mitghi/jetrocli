[package]
name = "jetrocli"
version = "0.1.0"
edition = "2021"
description = "Interactive split-pane TUI for jetro: paste JSON, query live, tab-complete."
license = "MIT"

[dependencies]
jetro      = "0.4"
jetro-core = "0.4"
serde_json    = "1"
ratatui       = "0.29"
crossterm     = "0.28"
tui-textarea  = "0.7"
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
