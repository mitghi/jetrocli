[package]
name = "jetrocli"
version = "0.2.3"
edition = "2021"
description = "Interactive split-pane TUI for jetro: paste JSON, do live query"
license = "MIT"
homepage = "https://github.com/mitghi/jetrocli"
repository = "https://github.com/mitghi/jetrocli"

[dependencies]
jetro-core    = "0.5.5"
serde_json    = "1"
indexmap      = "2"
ratatui       = "0.29"
crossterm     = "0.28"
tui-textarea  = "0.7"
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
regex         = "1"
memmap2       = "0.9"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["."]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "mitghi/homebrew-jetrocli"
# Customize the Homebrew formula name
formula = "jetrocli"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
