[package]
name = "jetrocli"
version = "0.2.0"
edition = "2021"
description = "Interactive split-pane TUI for jetro: paste JSON, do live query"
license = "MIT"

[dependencies]
jetro-core    = "0.5.0"
serde_json    = "1"
indexmap      = "2"
ratatui       = "0.29"
crossterm     = "0.28"
tui-textarea  = "0.7"
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
regex         = "1"
